<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Total sold · Bazzar</title>
<link rel="stylesheet" href="/ui/assets/styles.css"/>
</head>
<body class="dash-body" data-mode="sold">
<header class="topbar" id="topbar"></header>
<main class="dash">
    <h2>Total sold</h2>
    <p class="page-sub">Complete purchase history of the marketplace.</p>
    <section class="table-card">
        <div class="toolbar">
            <span class="count" id="count"></span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>ID</th><th>Seller</th><th>Buyer</th><th>Material</th><th>Amount</th><th>Price</th><th>Origin</th></tr>
                </thead>
                <tbody id="rows"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody>
            </table>
        </div>
        <div class="pager">
            <button class="icon-btn" id="prev" type="button">‹ Prev</button>
            <span id="pageinfo">–</span>
            <button class="icon-btn" id="next" type="button">Next ›</button>
        </div>
    </section>
</main>
<script src="/ui/assets/shared.js"></script>
<script src="/ui/assets/table.js"></script>
</body>
</html>
