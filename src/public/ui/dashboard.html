<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard · Bazzar</title>
<link rel="stylesheet" href="/ui/assets/styles.css"/>
</head>
<body class="dash-body">
<header class="topbar">
    <div class="brand" aria-hidden="true">
        <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>
        <span class="brand-name">BAZZAR</span>
    </div>
    <nav class="nav" aria-label="Main">
        <a class="nav-link" href="/ui/dashboard">Dashboard</a>
        <a class="nav-link" href="/ui/listings">Listings</a>
        <a class="nav-link" href="/ui/active">Active</a>
        <a class="nav-link" href="/ui/sold">Sold</a>
        <a class="nav-link" href="/ui/players">Players</a>
        <a class="nav-link" href="/ui/shop">Shop</a>
        <a class="nav-link" href="/ui/purchases">Purchases</a>
    </nav>
    <div class="spacer"></div>
    <div class="user-chip">
        <span class="badge member" id="role-badge">…</span>
        <span class="name" id="username">…</span>
        <span class="avatar" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
    </div>
    <button class="icon-btn danger" id="logout" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span class="btn-text">Log out</span>
    </button>
</header>

<main class="dash">
    <h2>Dashboard</h2>
    <p class="page-sub">Live overview of the Bazzar marketplace.</p>

    <section class="stat-grid" aria-label="Marketplace statistics">
        <a class="stat-card" href="/ui/listings">
            <div class="stat-head">
                <span class="stat-label">Total listings</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            </div>
            <span class="stat-value" id="totalListings">–</span>
        </a>
        <a class="stat-card" href="/ui/active">
            <div class="stat-head">
                <span class="stat-label">Active listings</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
            </div>
            <span class="stat-value" id="activeListings">–</span>
        </a>
        <a class="stat-card" href="/ui/sold">
            <div class="stat-head">
                <span class="stat-label">Total sold</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            </div>
            <span class="stat-value" id="totalSold">–</span>
        </a>
        <div class="stat-card">
            <div class="stat-head">
                <span class="stat-label">Website users</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"/></svg>
            </div>
            <span class="stat-value" id="totalUsers">–</span>
        </div>
        <a class="stat-card" href="/ui/players">
            <div class="stat-head">
                <span class="stat-label">MC players</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <span class="stat-value" id="totalPlayers">–</span>
        </a>
        <a class="stat-card" href="/ui/shop">
            <div class="stat-head">
                <span class="stat-label">Shop items</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <span class="stat-value" id="totalShopItems">–</span>
        </a>
        <a class="stat-card" href="/ui/purchases">
            <div class="stat-head">
                <span class="stat-label">Shop purchases</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <span class="stat-value" id="totalShopPurchases">–</span>
        </a>
    </section>

    <section class="table-card" aria-label="Website users">
        <div class="table-head">
            <h3>Website users</h3>
            <button class="icon-btn" id="refresh" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                <span class="btn-text">Refresh</span>
            </button>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>ID</th><th>Username</th><th>Role</th><th>Joined</th></tr>
                </thead>
                <tbody id="users-tbody">
                <tr class="empty-row"><td colspan="4">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="/ui/assets/dashboard.js"></script>
</body>
</html>
