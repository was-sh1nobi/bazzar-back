<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Shop Purchases · Bazzar</title>
<link rel="stylesheet" href="/ui/assets/styles.css"/>
</head>
<body class="dash-body">
<header class="topbar" id="topbar"></header>
<main class="dash">
    <div class="dash-header-row">
        <div>
            <h2>Shop Purchase Logs</h2>
            <p class="page-sub">Server shop transaction audit records and buyer receipts.</p>
        </div>
    </div>
    <section class="table-card">
        <div class="toolbar">
            <input id="search-player" type="search" placeholder="Filter by player or UUID…" aria-label="Filter player"/>
            <input id="search-item" type="search" placeholder="Filter by item or material…" aria-label="Filter item"/>
            <span class="count" id="count"></span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Player</th>
                    <th>Item / Material</th>
                    <th>Amount</th>
                    <th>Price / unit</th>
                    <th>Total Cost</th>
                    <th>Timestamp</th>
                </tr>
                </thead>
                <tbody id="rows"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody>
            </table>
        </div>
        <div class="pager">
            <button class="icon-btn" id="prev" type="button">‹ Prev</button>
            <span id="pageinfo">–</span>
            <button class="icon-btn" id="next" type="button">Next ›</button>
        </div>
    </section>
</main>
<script src="/ui/assets/shared.js"></script>
<script src="/ui/assets/purchases.js"></script>
</body>
</html>
